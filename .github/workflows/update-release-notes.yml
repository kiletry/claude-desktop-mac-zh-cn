name: Update published release notes

on:
  push:
    branches: [main]
    paths:
      - docs/release-notes/v0.1.18.md
      - .github/workflows/update-release-notes.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag with notes in docs/release-notes
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update notes without changing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || 'v0.1.18' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="docs/release-notes/${RELEASE_TAG}.md"
          test -s "$notes"
          gh release view "$RELEASE_TAG" --json url
          gh release edit "$RELEASE_TAG" --notes-file "$notes"
